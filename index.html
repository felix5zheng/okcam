<script>(() => {
  // ---- photos are stored encrypted (AES-GCM); decrypted in memory and shown only as CSS backgrounds
  const KA = [103, 233, 43, 212, 120, 125, 42, 143, 228, 105, 14, 212, 227, 89, 96, 52, 49, 183, 172, 126, 49, 99, 241, 48, 180, 157, 23, 118, 201, 80, 171, 243], KM = [169, 39, 176, 76, 11, 28, 181];
  let keyP = null;
  const getKey = () => keyP || (keyP = crypto.subtle.importKey('raw', new Uint8Array(KA.map((v, i) => v ^ KM[i % KM.length])), 'AES-GCM', false, ['decrypt']));
  const cache = new Map(); let current = '';
  const dec = (path) => {
    if (cache.has(path)) { const p = cache.get(path); cache.delete(path); cache.set(path, p); return p; }
    const p = (async () => {
      const r = await fetch(path); if (!r.ok) throw new Error(r.status);
      const buf = await r.arrayBuffer();
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, await getKey(), buf.slice(12));
      return URL.createObjectURL(new Blob([plain], { type: 'image/webp' }));
    })();
    cache.set(path, p); p.catch(() => cache.delete(path));
    // keep at most 40 large photos in memory
    const big = [...cache.keys()].filter(k => k.includes('/V/'));
    for (const k of big.slice(0, Math.max(0, big.length - 40))) { if (k === current) continue; cache.get(k).then(u => URL.revokeObjectURL(u)).catch(() => {}); cache.delete(k); }
    return p;
  };
  // ---- no saving: no context menu, no dragging, no save/print shortcuts
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('dragstart', e => e.preventDefault());
  document.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && ['s', 'u', 'p'].includes(e.key.toLowerCase())) e.preventDefault(); });
  const root = document.documentElement;
  const grid = document.getElementById('grid');
  const tiles = [...grid.querySelectorAll('.tile')];
  const N = tiles.length;
  const bigUrl = (k) => `img/V/${k}.dat`;
  const sheetUrl = (s) => `img/S/${s}.dat`;
  const sheetBlob = {};

  // ---- grid thumbnails: a sprite sheet (10 photos) loads when its tiles come near, the rest trickle in afterwards
  const bySheet = {}, loaded = {};
  for (const t of tiles) (bySheet[t.dataset.s] ||= []).push(t);
  const loadSheet = (sid) => {
    if (loaded[sid]) return; loaded[sid] = true;
    const list = bySheet[sid];
    dec(sheetUrl(sid)).then(u => {
      sheetBlob[sid] = u;
      const im = new Image();
      im.onload = () => list.forEach(t => { const ph = t.querySelector('.ph'); ph.style.setProperty('--bg', `url(${u})`); ph.classList.add('on'); t.classList.add('is-in'); });
      im.src = u;
    }).catch(() => list.forEach(t => t.classList.add('is-err')));
  };
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { loadSheet(e.target.dataset.s); io.unobserve(e.target); } }), { rootMargin: '1200px 0px' });
  tiles.forEach(t => io.observe(t));
  const order = Object.keys(bySheet).sort();
  const idle = window.requestIdleCallback || ((f) => setTimeout(f, 200));
  const trickle = () => { const nx = order.find(sid => !loaded[sid]); if (!nx) return; loadSheet(nx); idle(() => setTimeout(trickle, 120)); };
  window.addEventListener('load', () => setTimeout(trickle, 600));
  const warm = new Set();
  const prefetch = (k) => { if (!warm.has(k)) { warm.add(k); dec(bigUrl(k)).catch(() => warm.delete(k)); } };
  grid.addEventListener('pointerover', e => { const t = e.target.closest('.tile'); if (t) prefetch(t.dataset.k); });

  // ---- masonry: each photo drops into the shortest column, in order; columns follow the width
  let cols = 0;
  function layout(force) {
    const cs = getComputedStyle(root);
    const target = parseFloat(cs.getPropertyValue('--col-target'));
    const gap = parseFloat(cs.getPropertyValue('--tile-gap'));
    const W = grid.clientWidth;
    const n = Math.max(2, Math.floor((W + gap) / (target + gap)));
    if (n === cols && !force) return;
    cols = n;
    const colW = (W - gap * (n - 1)) / n;
    const els = Array.from({ length: n }, () => { const c = document.createElement('div'); c.className = 'col'; return c; });
    const h = new Array(n).fill(0);
    for (const t of tiles) {
      let m = 0; for (let i = 1; i < n; i++) if (h[i] < h[m] - 1) m = i;
      els[m].appendChild(t); h[m] += colW * (+t.dataset.r) / 100 + gap;
    }
    grid.replaceChildren(...els);
  }
  root.classList.add('js');
  layout(true);
  new ResizeObserver(() => layout(false)).observe(grid);

  // ---- viewer
  const lb = document.getElementById('lb');
  const stage = lb.querySelector('.lb-stage');
  const frame = lb.querySelector('.lb-frame');
  const img = frame.appendChild(Object.assign(document.createElement('div'), { className: 'lb-img' }));
  img.setAttribute('role', 'img');
  const veil = lb.querySelector('.lb-veil');
  const idx = lb.querySelector('.lb-idx');
  const prev = lb.querySelector('.lb-prev');
  const next = lb.querySelector('.lb-next');
  const byIndex = tiles.slice().sort((a, b) => a.dataset.i - b.dataset.i);
  let cur = -1, opener = null, token = 0;
  let s = 1, tx = 0, ty = 0, dy = 0;          // zoom, pan, drag-down offset
  const MAX = 4;

  const apply = (anim) => {
    frame.classList.toggle('anim', !!anim);
    const k = dy ? Math.max(0.82, 1 - Math.abs(dy) / 1400) : 1;
    frame.style.transform = `translate(${tx}px, ${ty + dy}px) scale(${s * k})`;
    veil.style.opacity = dy ? String(Math.max(0.15, 1 - Math.abs(dy) / 320)) : '';
    lb.classList.toggle('is-zoomed', s > 1.01);
    lb.classList.toggle('is-dragging', dy !== 0);
  };
  const center = () => { const r = stage.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };
  const clampPan = () => {
    const fw = frame.offsetWidth, fh = frame.offsetHeight;
    const mx = Math.max(0, (fw * s - innerWidth) / 2) + (s > 1.01 ? 24 : 0);
    const my = Math.max(0, (fh * s - innerHeight) / 2) + (s > 1.01 ? 24 : 0);
    tx = Math.min(mx, Math.max(-mx, tx)); ty = Math.min(my, Math.max(-my, ty));
  };
  const zoomAt = (px, py, ns, fromS = s, fromX = tx, fromY = ty) => {
    const c = center();
    const qx = (px - c.x - fromX) / fromS, qy = (py - c.y - fromY) / fromS;
    s = Math.min(MAX, Math.max(1, ns)); tx = px - c.x - qx * s; ty = py - c.y - qy * s;
    if (s <= 1.01) { s = 1; tx = 0; ty = 0; }
    clampPan();
  };
  const reset = (anim) => { s = 1; tx = 0; ty = 0; dy = 0; apply(anim); };
  const toggleZoom = (x, y) => { if (s > 1.01) reset(true); else { zoomAt(x, y, 2.5); apply(true); } };

  function show(i) {
    if (i < 0 || i >= N) return;
    cur = i; reset(false);
    const t = byIndex[i], k = t.dataset.k, ph = t.querySelector('.ph');
    frame.style.setProperty('--r', (+t.dataset.r) / 100);
    frame.style.backgroundImage = sheetBlob[t.dataset.s] ? `url(${sheetBlob[t.dataset.s]})` : 'none';
    frame.style.backgroundPosition = ph.style.backgroundPosition;
    img.setAttribute('aria-label', ph.getAttribute('aria-label'));
    idx.textContent = `${i + 1} / ${N}`;
    prev.disabled = i === 0; next.disabled = i === N - 1;
    const my = ++token;
    img.classList.remove('ready'); lb.classList.add('is-loading');
    current = bigUrl(k);
    dec(current).then(u => {
      const im = new Image();
      im.onload = () => { if (my === token) { img.style.backgroundImage = `url(${u})`; img.classList.add('ready'); lb.classList.remove('is-loading'); } };
      im.src = u;
    }).catch(() => { if (my === token) lb.classList.remove('is-loading'); });
    for (const j of [i - 1, i + 1, i + 2]) if (byIndex[j]) prefetch(byIndex[j].dataset.k);
    history.replaceState(null, '', `${location.pathname}${location.search}#${k}`);
  }
  function openAt(i, from) { opener = from || null; if (!lb.open) lb.showModal(); show(i); }
  const close = () => { if (lb.open) lb.close(); };
  lb.addEventListener('close', () => {
    token++; reset(false); img.style.backgroundImage = 'none'; current = '';
    history.replaceState(null, '', `${location.pathname}${location.search}`);
    const back = opener || byIndex[cur]; if (back) back.focus({ preventScroll: true });
  });
  lb.addEventListener('cancel', () => reset(false));

  // touch opens on a clean tap (pointerup), so a suppressed click never leaves a tile dead; mouse and keyboard use click
  let down = null, openedAt = -1e9;
  grid.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') down = { x: e.clientX, y: e.clientY, t: performance.now(), tile: e.target.closest('.tile') }; });
  grid.addEventListener('pointerup', e => {
    const d = down; down = null;
    if (!d || !d.tile || e.pointerType === 'mouse') return;
    if (Math.hypot(e.clientX - d.x, e.clientY - d.y) < 10 && performance.now() - d.t < 600) { openedAt = performance.now(); openAt(+d.tile.dataset.i, d.tile); }
  });
  grid.addEventListener('pointercancel', () => { down = null; });
  grid.addEventListener('click', e => {
    const t = e.target.closest('.tile');
    if (!t || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
    e.preventDefault();
    if (performance.now() - openedAt < 800) return;
    openAt(+t.dataset.i, t);
  });
  prev.addEventListener('click', () => show(cur - 1));
  next.addEventListener('click', () => show(cur + 1));
  lb.querySelector('.lb-close-sr').addEventListener('click', close);
  lb.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') { e.preventDefault(); show(cur - 1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); show(cur + 1); }
    else if (e.key === '+' || e.key === '=') { const c = center(); zoomAt(c.x, c.y, s * 1.5); apply(true); }
    else if (e.key === '-') { const c = center(); zoomAt(c.x, c.y, s / 1.5); apply(true); }
  });

  // ---- gestures: tap outside closes, drag up or down closes, swipe sideways turns, pinch / double-tap / click zooms, drag pans when zoomed
  const pts = new Map();
  let g = null, lastTap = { t: 0, x: 0, y: 0 };
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
  const startOne = (e, moved) => ({ type: 'one', x0: e.clientX, y0: e.clientY, tx0: tx, ty0: ty, t0: performance.now(), moved, mode: moved ? (s > 1.01 ? 'pan' : null) : null, onFrame: !!e.target.closest('.lb-frame'), pointerType: e.pointerType });

  stage.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    stage.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) g = startOne(e, false);
    else if (pts.size === 2) { const [a, b] = [...pts.values()]; g = { type: 'pinch', d0: dist(a, b), m0: mid(a, b), s0: s, tx0: tx, ty0: ty }; dy = 0; }
  });
  stage.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId) || !g) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (g.type === 'pinch' && pts.size >= 2) {
      const [a, b] = [...pts.values()], m = mid(a, b);
      zoomAt(g.m0.x, g.m0.y, g.s0 * dist(a, b) / g.d0, g.s0, g.tx0, g.ty0);
      tx += m.x - g.m0.x; ty += m.y - g.m0.y; clampPan(); apply(false);
      return;
    }
    if (g.type !== 'one') return;
    const dx = e.clientX - g.x0, ddy = e.clientY - g.y0;
    if (!g.moved && Math.hypot(dx, ddy) > 6) {
      g.moved = true;
      g.mode = s > 1.01 ? 'pan' : (Math.abs(ddy) > Math.abs(dx) ? 'down' : 'swipe');
    }
    if (g.mode === 'pan') { tx = g.tx0 + dx; ty = g.ty0 + ddy; clampPan(); apply(false); }
    else if (g.mode === 'down') { dy = ddy; apply(false); }
    else if (g.mode === 'swipe') { tx = dx * 0.5; apply(false); }
  });
  const end = (e) => {
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if (!g) return;
    if (g.type === 'pinch') {
      if (pts.size === 1) { const [p] = [...pts.values()]; g = { ...startOne({ clientX: p.x, clientY: p.y, target: frame, pointerType: 'touch' }, true) }; }
      else if (pts.size === 0) { if (s < 1.05) reset(true); g = null; }
      return;
    }
    if (pts.size) return;
    const gg = g; g = null;
    const dx = e.clientX - gg.x0;
    if (!gg.moved) {
      if (e.type === 'pointercancel') return;
      if (!gg.onFrame) { if (s > 1.01) reset(true); else close(); return; }
      if (gg.pointerType === 'mouse') { toggleZoom(e.clientX, e.clientY); return; }
      const now = performance.now();
      if (now - lastTap.t < 320 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 30) { lastTap.t = 0; toggleZoom(e.clientX, e.clientY); }
      else lastTap = { t: now, x: e.clientX, y: e.clientY };
      return;
    }
    if (gg.mode === 'down') { if (Math.abs(dy) > 90) close(); else { dy = 0; apply(true); } }
    else if (gg.mode === 'swipe') { if (Math.abs(dx) > 60 && byIndex[cur + (dx < 0 ? 1 : -1)]) show(cur + (dx < 0 ? 1 : -1)); else reset(true); }
  };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
  stage.addEventListener('wheel', e => {
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, s * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0025)));
    apply(false);
  }, { passive: false });

  // deep link: #<number> opens that photo
  const h = location.hash.slice(1);
  if (h) { const t = tiles.find(x => x.dataset.k === h); if (t) openAt(+t.dataset.i, t); }
})();
</script>
</body>
</html>
